<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plugin — SolaX</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --bg: #141414;
      --panel: #1f1f1f;
      --card: #2a2a2a;
      --line: #3a3a3a;
      --text: #f4f4f7;
      --muted: #9a9aa8;
      --purple: #7c5cfc;
      --purple-soft: #b794f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
    }
    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(20,20,20,0.96), transparent);
    }
    .top a, .top button { pointer-events: auto; }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.04em;
      z-index: 2;
    }
    .brand img { width: 36px; height: 36px; border-radius: 10px; }
    .top-center {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 61;
    }
    .download, .review, .login, .discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      color: #fff;
    }
    .download {
      background: var(--purple);
      box-shadow: 0 8px 24px rgba(124, 92, 252, 0.55);
    }
    .download:hover { background: #8f74ff; }
    .review, .login {
      background: transparent;
      border: 1px solid var(--purple);
    }
    .review:hover, .login:hover, .review.current { background: var(--purple); }
    .login { margin-left: auto; z-index: 2; }
    .discord {
      padding: 10px 16px;
      border: 1px solid #3d3d4a;
      color: var(--text);
      background: rgba(22, 22, 26, 0.8);
      font-size: 14px;
      font-weight: 600;
    }
    .discord:hover { border-color: var(--purple); color: var(--purple-soft); }
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 96px 24px 40px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .search {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #1a1a1a;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #1a1a1a;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }
    .icon-btn.on { border-color: var(--purple); color: var(--purple-soft); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .grid.list { grid-template-columns: 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      min-height: 168px;
    }
    .card h3 { font-size: 18px; font-weight: 650; margin-bottom: 8px; }
    .card .desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
    }
    .card .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .ghost:hover { border-color: var(--purple); }
    .price {
      margin-left: auto;
      font-size: 12px;
      font-weight: 700;
      color: var(--purple-soft);
      border: 1px solid rgba(124, 92, 252, 0.45);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .empty { color: var(--muted); padding: 48px 8px; }
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.62);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }
    .modal.wide { width: min(520px, 100%); }
    .modal h3 { font-size: 20px; margin-bottom: 6px; }
    .modal .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .modal label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .modal input, .modal textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #121216;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
    }
    .modal textarea { min-height: 120px; resize: vertical; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
    .modal-actions button, .modal-actions a.send {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #121216;
      color: var(--text);
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .modal-actions .send {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }
    .stat {
      background: #121216;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      margin-top: 8px;
    }
    .stat .num { font-size: 42px; font-weight: 700; color: var(--purple-soft); }
    .stat .lbl { color: var(--muted); margin-top: 6px; }
    #review-status, #login-status { min-height: 18px; font-size: 13px; color: var(--purple-soft); margin-bottom: 8px; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .top-center { position: static; transform: none; flex-wrap: wrap; justify-content: center; }
      .top { flex-wrap: wrap; gap: 10px; pointer-events: auto; }
      .login { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <img src="icon.png" alt="SolaX" />
      SolaX
    </a>
    <div class="top-center">
      <a class="download" href="https://github.com/SisoSeller/solax/releases/latest/download/SolaX-Setup.exe" download="SolaX-Setup.exe">Download</a>
      <a class="review current" href="plugins.html">Plugin</a>
      <button type="button" class="review" id="review-open">Review</button>
      <a class="discord" href="https://discord.gg/zq3fR5MxgU" target="_blank" rel="noopener">Discord</a>
    </div>
  </header>

  <main class="page">
    <div class="toolbar">
      <input class="search" id="plugin-search" type="search" placeholder="Search for plugins..." />
      <button type="button" class="icon-btn" id="view-toggle" title="Elenco">☰</button>
    </div>
    <div class="grid" id="plugin-grid">
      <p class="empty">Caricamento...</p>
    </div>
  </main>

  <div class="modal-bg" id="details-modal">
    <div class="modal">
      <h3 id="details-title">Plugin</h3>
      <p class="hint" id="details-text"></p>
      <div class="modal-actions">
        <button type="button" id="details-close">Chiudi</button>
        <a class="send" id="details-download" href="#" download>Scarica</a>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="review-modal">
    <div class="modal">
      <h3>Review</h3>
      <p class="hint">Puoi inviare una review al giorno.</p>
      <label for="review-name">Nome</label>
      <input id="review-name" maxlength="32" placeholder="Anonimo" />
      <label for="review-text">Review</label>
      <textarea id="review-text" maxlength="1000" placeholder="Scrivi la tua review..."></textarea>
      <p id="review-status"></p>
      <div class="modal-actions">
        <button type="button" id="review-close">Chiudi</button>
        <button type="button" class="send" id="review-send">Invia</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DISCORD = "https://discord.gg/zq3fR5MxgU";
      var grid = document.getElementById("plugin-grid");
      var search = document.getElementById("plugin-search");
      var viewBtn = document.getElementById("view-toggle");
      var details = document.getElementById("details-modal");
      var catalog = [];
      var listView = false;

      function priceLabel(p) {
        p = Number(p) || 0;
        return p <= 0 ? "Free" : ("€" + p);
      }
      function render() {
        var q = (search.value || "").trim().toLowerCase();
        var list = catalog.filter(function (p) {
          if (!q) return true;
          return (p.name || "").toLowerCase().indexOf(q) >= 0 || (p.description || "").toLowerCase().indexOf(q) >= 0;
        });
        grid.className = listView ? "grid list" : "grid";
        if (!list.length) {
          grid.innerHTML = '<p class="empty">Nessun plugin per ora.</p>';
          return;
        }
        grid.innerHTML = "";
        list.forEach(function (p) {
          var card = document.createElement("article");
          card.className = "card";
          var paid = Number(p.price) > 0;
          var bundled = !!p.bundled;
          var action = paid
            ? '<a class="ghost" href="' + DISCORD + '" target="_blank" rel="noopener">Acquista</a>'
            : (bundled
              ? '<a class="ghost" href="https://github.com/SisoSeller/solax/releases/latest/download/SolaX-Setup.exe">Nell’app</a>'
              : (p.file
                ? '<a class="ghost" href="store/' + encodeURIComponent(p.file) + '" download="' + String(p.file).replace(/"/g, "") + '">Scarica</a>'
                : ""));
          card.innerHTML = "<h3></h3><p class=\"desc\"></p><div class=\"row\"><button type=\"button\" class=\"ghost details\">Details</button>" + action + "<span class=\"price\"></span></div>";
          card.querySelector("h3").textContent = p.name || p.id;
          card.querySelector(".desc").textContent = p.description || "";
          card.querySelector(".price").textContent = priceLabel(p.price);
          card.querySelector(".details").addEventListener("click", function () {
            document.getElementById("details-title").textContent = p.name || p.id;
            document.getElementById("details-text").textContent = (p.description || "") + (paid ? ("\n\nPrezzo: " + priceLabel(p.price)) : "");
            var dl = document.getElementById("details-download");
            if (p.file && !paid && !p.bundled) {
              dl.style.display = "";
              dl.href = "store/" + encodeURIComponent(p.file);
              dl.setAttribute("download", p.file);
              dl.textContent = "Scarica";
            } else if (p.bundled) {
              dl.style.display = "";
              dl.href = "https://github.com/SisoSeller/solax/releases/latest/download/SolaX-Setup.exe";
              dl.removeAttribute("download");
              dl.textContent = "Download app";
            } else {
              dl.style.display = paid ? "" : "none";
              dl.href = DISCORD;
              dl.removeAttribute("download");
              dl.target = "_blank";
              dl.textContent = "Discord";
            }
            details.classList.add("open");
          });
          grid.appendChild(card);
        });
      }
      search.addEventListener("input", render);
      viewBtn.addEventListener("click", function () {
        listView = !listView;
        viewBtn.classList.toggle("on", listView);
        render();
      });
      document.getElementById("details-close").addEventListener("click", function () { details.classList.remove("open"); });
      details.addEventListener("click", function (e) { if (e.target === details) details.classList.remove("open"); });
      fetch("store.json?t=" + Date.now())
        .then(function (r) { return r.ok ? r.json() : { plugins: [] }; })
        .then(function (data) {
          catalog = data && Array.isArray(data.plugins) ? data.plugins : [];
          render();
        })
        .catch(function () {
          catalog = [];
          render();
        });

      var hook = "https://discord.com/api/webhooks/1539625156920742030/2RLS-TeitMn-Xa2kUNQxRBse3IFbxdaIR0XqKn6RgsT5JGc0rirR_MK46bl7PDSK95tD";
      var key = "solax_review_day";
      var modal = document.getElementById("review-modal");
      var statusEl = document.getElementById("review-status");
      var sendBtn = document.getElementById("review-send");
      var nameEl = document.getElementById("review-name");
      var textEl = document.getElementById("review-text");
      function today() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function alreadySent() { return localStorage.getItem(key) === today(); }
      function setStatus(msg) { statusEl.textContent = msg; }
      function clean(value) {
        return String(value || "")
          .replace(/@everyone/gi, "")
          .replace(/@here/gi, "")
          .replace(/https?:\/\/discord(?:app)?\.com\/api\/webhooks\/\S+/gi, "")
          .trim();
      }
      document.getElementById("review-open").addEventListener("click", function () {
        modal.classList.add("open");
        if (alreadySent()) {
          setStatus("Hai già inviato una review oggi.");
          nameEl.disabled = true;
          textEl.disabled = true;
          sendBtn.disabled = true;
        }
      });
      document.getElementById("review-close").addEventListener("click", function () { modal.classList.remove("open"); });
      modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.remove("open"); });
      sendBtn.addEventListener("click", function () {
        if (alreadySent()) return;
        var name = clean(nameEl.value) || "Anonimo";
        var text = clean(textEl.value);
        if (!text) { setStatus("Scrivi una review."); return; }
        sendBtn.disabled = true;
        var payload = {
          username: "REVIEW BOT",
          embeds: [{
            title: "Review",
            description: text.slice(0, 1000),
            color: 8146172,
            fields: [{ name: "Da", value: name, inline: true }],
            timestamp: new Date().toISOString()
          }]
        };
        var form = new FormData();
        form.append("payload_json", JSON.stringify(payload));
        fetch(hook, { method: "POST", body: form, mode: "no-cors" })
          .then(function () {
            localStorage.setItem(key, today());
            setStatus("Review inviata.");
            nameEl.disabled = true;
            textEl.disabled = true;
          })
          .catch(function () {
            sendBtn.disabled = false;
            setStatus("Invio non riuscito. Riprova.");
          });
      });
    })();
  </script>
</body>
</html>
